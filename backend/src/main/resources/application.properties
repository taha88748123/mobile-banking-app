# ============================================================
# CONFIGURATION SERVEUR
# ============================================================
server.port=8080
spring.application.name=banking-backend

# ============================================================
# BASE DE DONNEES H2 (mode dev par defaut, run facile)
# Pour MySQL, decommenter les lignes plus bas
# ============================================================
spring.datasource.url=jdbc:h2:mem:bankdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ============================================================
# CONFIGURATION MYSQL (decommenter pour basculer en MySQL)
# ============================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/bankdb?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ============================================================
# CONFIGURATION EMAIL (OTP par mail)
# REMPLACER PAR L'EMAIL ET APP PASSWORD GMAIL DE L'UTILISATEUR
# Generer un App Password : https://myaccount.google.com/apppasswords
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Les credentials Gmail doivent etre fournis via variables d'environnement.
# Sur Windows PowerShell :
#   $env:GMAIL_USER = "votre_email@gmail.com"
#   $env:GMAIL_APP_PASSWORD = "votre_app_password_16_chars"
# Generer un App Password : https://myaccount.google.com/apppasswords
spring.mail.username=${GMAIL_USER:CHANGEME@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD:CHANGEME}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Envoi de vrais emails OTP via Gmail
app.email.simulate=false

# ============================================================
# JWT
# ============================================================
jwt.secret=monSecretSuperLongPourJWT123456789AZERTYUIOPQSDFGHJKLMWXCVBN
jwt.expiration=86400000

# ============================================================
# LOGS
# ============================================================
logging.level.org.springframework.security=INFO
logging.level.com.banking=INFO
